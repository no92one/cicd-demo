name: Testing

on: 
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: ./backend

        steps:
          - uses: actions/checkout@v4
          
          - name: Use Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 22
              cache: "npm"
              cache-dependency-path: package-lock.json 

          - name: Install dependencies
            run: npm ci

          - name: Check syntax
            run: node --check server.js

    test:
        runs-on: ubuntu-latest
        needs: build

        defaults:
          run:
            working-directory: ./backend

        steps:
          - name: Checkout repository
            uses: actions/checkout@v4
        
          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 22
              cache: npm
              cache-dependency-path: backend/package-lock.json


          - name: Install dependencies
            run: npm ci

          - name: Start REST API
            run: |
              node server.js > /tmp/api.log 2>&1 &

          - name: Wait for API
            run: |
              for i in {1..30}; do
                if curl --fail --silent \
                  http://127.0.0.1:3000/health > /dev/null; then
                  echo "API is ready!"
                  exit 0
                fi
                sleep 1
              done

              cat /tmp/api.log
              exit 1
          
          - name: Run Newman tests
            run: npm run test:api